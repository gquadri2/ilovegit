name: Check README for Name

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-readme:
    runs-on: ubuntu-latest

    steps:
      # 1. Checks-out the repository under $GITHUB_WORKSPACE
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Checks if the name exists inside README.md
      - name: Verify Name in README
        run: |
          NAME="gquadri2"
          README_PATH="README.md"
          
          if grep -qi "$NAME" "$README_PATH"; then
            echo "✅ Check passed: The name '$NAME' is present in $README_PATH."
          else
            echo "❌ ERROR: $README_PATH does not contain the name '$NAME'."
            exit 1
          fi
